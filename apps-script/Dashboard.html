<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Center Ranking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2;
    --surface: #fcfcfb;
    --surface-2: #f0efec;
    --line: #e2e1dc;
    --text: #0b0b0b;
    --text-2: #52514e;
    --text-3: #7a7974;
    --accent: #2a78d6;
    --track: #e8eef7;
    --good: #0ca30c;  --good-ink: #006300;  --good-bg: #e2f3e2;
    --bad: #d03b3b;   --bad-ink: #a32323;   --bad-bg: #fbe4e4;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #2f2f2c;
      --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86;
      --accent: #3987e5; --track: #1f2a38;
      --good-ink: #5fd35f; --good-bg: #173417;
      --bad-ink: #f08a8a;  --bad-bg: #3d1d1d;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #2f2f2c;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86;
    --accent: #3987e5; --track: #1f2a38;
    --good-ink: #5fd35f; --good-bg: #173417;
    --bad-ink: #f08a8a;  --bad-bg: #3d1d1d;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 40px; }

  header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--text-2); margin-top: 2px; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .controls label { color: var(--text-2); font-size: 13px; }
  select {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 30px 7px 10px; min-width: 150px;
    appearance: none; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
    background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat;
  }
  select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .fresh { color: var(--text-3); font-size: 12px; }

  .banner { background: var(--surface-2); color: var(--text-2); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; font-size: 13px; }
  .banner[hidden] { display: none; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
  .kpi .k { color: var(--text-2); font-size: 12px; }
  .kpi .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .n { color: var(--text-3); font-size: 12px; margin-top: 2px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px; min-width: 0; }
  .card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .hint { color: var(--text-3); font-size: 12px; }

  /* Ranking */
  .rank-row { display: grid; grid-template-columns: 28px 64px minmax(80px, 1fr) 58px 250px; gap: 12px; align-items: center; padding: 8px 4px; border-top: 1px solid var(--line); cursor: default; }
  .rank-row:first-of-type { border-top: 0; }
  .rank-row:hover { background: var(--surface-2); border-radius: 8px; }
  .rk { font-weight: 600; color: var(--text-2); text-align: center; font-variant-numeric: tabular-nums; }
  .ct { font-weight: 600; }
  .bar { position: relative; height: 12px; background: var(--track); border-radius: 4px; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; }
  .bar > b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text-2); opacity: .55; }
  .sc { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; justify-self: start; }
  .chip.ok { background: var(--good-bg); color: var(--good-ink); }
  .chip.no { background: var(--bad-bg); color: var(--bad-ink); }
  .dl { font-size: 12px; color: var(--text-3); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dl .up { color: var(--good-ink); } .dl .down { color: var(--bad-ink); }
  .legend-target { display: inline-flex; align-items: center; gap: 6px; }
  .legend-target::before { content: ""; width: 2px; height: 12px; background: var(--text-2); opacity: .55; }

  /* Category matrix */
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.mx { border-collapse: separate; border-spacing: 2px; width: 100%; min-width: 640px; font-variant-numeric: tabular-nums; }
  .mx th { font-size: 12px; color: var(--text-2); font-weight: 600; text-align: center; padding: 4px 6px; }
  .mx th:first-child { text-align: left; }
  .mx td { text-align: center; padding: 8px 6px; border-radius: 6px; font-weight: 600; }
  .mx td:first-child { text-align: left; font-weight: 600; background: transparent; }
  .mx td.pass { background: var(--good-bg); color: var(--good-ink); }
  .mx td.fail { background: var(--bad-bg); color: var(--bad-ink); }
  .mx td.none { color: var(--text-3); font-weight: 400; background: var(--surface-2); }
  .mx td.acc { color: var(--text); background: var(--surface-2); }
  .mx td .ic { font-size: 11px; margin-right: 3px; }

  /* Center detail */
  .rank-row, .mx tbody tr { cursor: pointer; }
  .rank-row.sel { background: var(--surface-2); border-radius: 8px; box-shadow: inset 3px 0 0 var(--accent); }
  .mx tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--text-2);
    padding: 4px 12px; border-radius: 999px; cursor: pointer; }
  .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dsum { color: var(--text-2); font-size: 13px; margin: -4px 0 8px; }
  .dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .dcard { border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
  .dcard.nodata { color: var(--text-3); background: var(--surface-2); border-style: dashed; }
  .dhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .dhead h3 { font-size: 14px; font-weight: 600; margin: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat .k { font-size: 11px; color: var(--text-3); }
  .sub-h { font-size: 12px; font-weight: 600; color: var(--text-2); margin: 10px 0 6px; display: flex; justify-content: space-between; gap: 8px; }
  .sub-h span { font-weight: 400; color: var(--text-3); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal .wd { font-size: 10px; color: var(--text-3); text-align: center; }
  .cal .d { font-size: 11px; text-align: center; border-radius: 4px; padding: 4px 0; font-variant-numeric: tabular-nums; }
  .cal .d.pass { background: var(--good-bg); color: var(--good-ink); font-weight: 600; }
  .cal .d.fail { background: var(--bad-bg); color: var(--bad-ink); font-weight: 600; }
  .cal .d.none { background: var(--surface-2); color: var(--text-3); }
  .mf { display: grid; grid-template-columns: minmax(0, 1fr) 70px 64px; gap: 4px 8px; align-items: center; font-size: 12px; }
  .mf .f { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mf .b { height: 8px; background: var(--track); border-radius: 4px; position: relative; }
  .mf .b i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); }
  .mf .n { text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .muted { color: var(--text-3); font-size: 12px; }
  .calkey { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--text-3); margin: -4px 0 12px; }
  .calkey span { display: inline-flex; align-items: center; gap: 6px; }
  .calkey i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .calkey i.pass { background: var(--good-bg); box-shadow: inset 0 0 0 1px var(--good-ink); }
  .calkey i.fail { background: var(--bad-bg); box-shadow: inset 0 0 0 1px var(--bad-ink); }
  .calkey i.none { background: var(--surface-2); }

  details.how { color: var(--text-2); font-size: 13px; }
  details.how summary { cursor: pointer; color: var(--text); font-weight: 600; }
  details.how ul { margin: 8px 0 0; padding-left: 18px; }
  details.how li { margin: 4px 0; }

  #tip {
    position: fixed; z-index: 10; pointer-events: none; opacity: 0; transition: opacity .08s;
    background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.14); padding: 8px 10px; font-size: 12px; max-width: 280px;
  }
  #tip.on { opacity: 1; }
  #tip .t { font-weight: 600; margin-bottom: 4px; }
  #tip .r { display: flex; justify-content: space-between; gap: 14px; color: var(--text-2); }
  #tip .r b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  #tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

  .state { padding: 48px 16px; text-align: center; color: var(--text-2); }
  .skel { height: 14px; border-radius: 4px; background: var(--surface-2); margin: 10px 0; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }

  @media (max-width: 760px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .rank-row { grid-template-columns: 24px 44px minmax(60px, 1fr) 52px; grid-template-areas: "rk ct bar sc" ". meta meta meta"; column-gap: 10px; row-gap: 6px; }
    .rank-row .rk { grid-area: rk; } .rank-row .ct { grid-area: ct; } .rank-row .bar { grid-area: bar; }
    .rank-row .sc { grid-area: sc; } .rank-row .meta { grid-area: meta; }
    .kpi .v { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Center Ranking</h1>
      <div class="sub">Sparks Swim · akurasi administrasi per center</div>
    </div>
    <div class="controls">
      <label for="period">Bulan</label>
      <select id="period" disabled><option>Memuat…</option></select>
      <span class="fresh" id="fresh"></span>
    </div>
  </header>

  <div class="banner" id="running" hidden>Bulan ini masih berjalan, jadi angkanya masih bisa berubah sampai akhir bulan.</div>

  <div id="app">
    <div class="card"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel"></div><div class="skel" style="width:70%"></div></div>
  </div>
</div>
<div id="tip" role="tooltip"></div>

<script>
(function () {
  'use strict';
  let D = null;          // payload
  let period = '';
  let center = '';        // center shown in the detail panel
  const periodDetail = {}; // period → { available, daily, missing } (loaded on demand)
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (v, d) => (v == null || isNaN(v)) ? '—' : (v * 100).toFixed(d || 0) + '%';
  const num = v => Number(v).toLocaleString('id-ID');

  // ── data ──────────────────────────────────────────────────────────────────
  function load() {
    google.script.run
      .withSuccessHandler(json => { D = JSON.parse(json); init(); })
      .withFailureHandler(err => {
        $('#app').innerHTML = '<div class="card state">Gagal memuat data.<br><span class="hint">' + esc(err && err.message || err) + '</span></div>';
      })
      .crGetDashboardData();
  }

  function init() {
    if (!D.periods.length) {
      $('#app').innerHTML = '<div class="card state">Belum ada data. Jalankan <b>📊 Center Ranking → Refresh now</b> di spreadsheet.</div>';
      $('#period').innerHTML = '<option>—</option>';
      return;
    }
    const sel = $('#period');
    sel.innerHTML = D.periods.slice().reverse().map(p =>
      '<option value="' + p.key + '">' + esc(p.label) + (p.running ? ' (berjalan)' : '') + '</option>').join('');
    let saved = '';
    try { saved = localStorage.getItem('cr.period') || ''; } catch (e) {}
    period = D.periods.some(p => p.key === saved) ? saved : D.defaultPeriod;
    sel.value = period;
    sel.disabled = false;
    sel.addEventListener('change', () => {
      period = sel.value;
      try { localStorage.setItem('cr.period', period); } catch (e) {}
      render();
    });
    if (D.refreshedAt) {
      const t = new Date(D.refreshedAt);
      $('#fresh').textContent = 'Data per ' + t.toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }
    try { center = localStorage.getItem('cr.center') || ''; } catch (e) {}
    render();
  }

  const rowsFor = p => D.ranking.filter(r => r.period === p).sort((a, b) => a.rank - b.rank);
  const detailFor = (p, c, k) => D.detail.find(d => d.period === p && d.center === c && d.cat === k);
  const prevPeriod = p => { const i = D.periods.findIndex(x => x.key === p); return i > 0 ? D.periods[i - 1].key : null; };
  const label = p => (D.periods.find(x => x.key === p) || {}).label || p;

  // ── render ────────────────────────────────────────────────────────────────
  function render() {
    const rows = rowsFor(period);
    const pInfo = D.periods.find(p => p.key === period);
    $('#running').hidden = !(pInfo && pInfo.running);
    const acc = rows.filter(r => r.accurate).length;
    const avg = rows.length ? rows.reduce((s, r) => s + r.score, 0) / rows.length : null;
    const best = rows[0], worst = rows[rows.length - 1];

    $('#app').innerHTML =
      '<section class="kpis">' +
        kpi('Center akurat', acc + ' <span style="font-size:15px;color:var(--text-3);font-weight:400">dari ' + rows.length + '</span>', 'semua kategori PASS') +
        kpi('Terbaik', best ? esc(best.center) : '—', best ? 'skor ' + pct(best.score, 1) : '') +
        kpi('Terburuk', worst ? esc(worst.center) : '—', worst ? 'skor ' + pct(worst.score, 1) : '') +
        kpi('Rata-rata skor', pct(avg, 1), 'target ' + pct(D.monthPass)) +
      '</section>' +
      '<section class="card">' +
        '<div class="card-h"><h2>Ranking terbaik → terburuk · ' + esc(label(period)) + '</h2>' +
        '<span class="hint legend-target">target ' + pct(D.monthPass) + '</span></div>' +
        '<div id="rank">' + rows.map(rankRow).join('') + '</div>' +
      '</section>' +
      '<section class="card">' +
        '<div class="card-h"><h2>Days Pass % per kategori</h2><span class="hint">✓ PASS ≥ ' + pct(D.monthPass) + ' · ✗ FAIL · — tidak ada data</span></div>' +
        '<div class="scroll"><table class="mx"><thead><tr><th>Center</th>' +
          D.categories.map(c => '<th>' + esc(c.name) + '</th>').join('') + '<th>Month Accuracy</th></tr></thead><tbody>' +
          rows.map(matrixRow).join('') +
        '</tbody></table></div>' +
      '</section>' +
      '<section class="card" id="detail"></section>' +
      '<section class="card"><details class="how"><summary>Cara membaca</summary><ul>' +
        '<li><b>Daily %</b> = record lengkap ÷ record yang diaudit di hari itu. Satu hari <b>lolos</b> kalau Daily % ≥ ' + pct(D.dailyMin) + '.</li>' +
        '<li><b>Days Pass %</b> = hari lolos ÷ hari aktif dalam sebulan (hari tanpa record tidak dihitung). Kategori <b>PASS</b> kalau ≥ ' + pct(D.monthPass) + '.</li>' +
        '<li><b>Skor</b> center = rata-rata Days Pass % dari kategori yang punya data. Kategori kosong tidak dihitung sebagai gagal.</li>' +
        '<li><b>Akurat</b> = semua kategori yang punya data berstatus PASS.</li>' +
        '<li><b>Ranking</b> = skor tertinggi dulu. Kalau seri: lebih banyak kategori PASS, lalu Month Accuracy lebih tinggi.</li>' +
        '<li>▲/▼ = perubahan peringkat dibanding bulan sebelumnya.</li>' +
        '<li><b>Detail center</b>: klik center di ranking atau tabel. Kalender menandai hari lolos (✓, Daily % ≥ ' + pct(D.dailyMin) + ') dan gagal (✗). ' +
          '<b>Field kosong teratas</b> = kolom yang paling sering kosong di record yang tidak lengkap. Satu record bisa kosong di beberapa kolom.</li>' +
      '</ul></details></section>';

    if (!rows.some(r => r.center === center)) center = rows.length ? rows[0].center : '';
    document.querySelectorAll('.rank-row, .mx tbody tr').forEach(el => {
      el.addEventListener('click', () => selectCenter(el.dataset.c, true));
    });
    bindTips();
    renderDetail();
  }

  function selectCenter(c, scroll) {
    if (!c) return;
    center = c;
    try { localStorage.setItem('cr.center', c); } catch (e) {}
    renderDetail();
    if (scroll) $('#detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function kpi(k, v, n) {
    return '<div class="kpi"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="n">' + n + '</div></div>';
  }

  function rankRow(r) {
    const prev = prevPeriod(period);
    const pr = prev && D.ranking.find(x => x.period === prev && x.center === r.center);
    let delta = '<span title="tidak ada data bulan lalu">baru</span>';
    if (pr) {
      const d = pr.rank - r.rank;
      delta = d > 0 ? '<span class="up">▲ ' + d + '</span>' : d < 0 ? '<span class="down">▼ ' + (-d) + '</span>' : '<span title="peringkat sama dengan bulan lalu">= tetap</span>';
    }
    return '<div class="rank-row" data-tip="rank" data-c="' + esc(r.center) + '">' +
      '<div class="rk">' + r.rank + '</div>' +
      '<div class="ct">' + esc(r.center) + '</div>' +
      '<div class="bar" aria-hidden="true"><i style="width:' + (r.score * 100).toFixed(1) + '%"></i><b style="left:calc(' + (D.monthPass * 100) + '% - 1px)"></b></div>' +
      '<div class="sc">' + pct(r.score, 1) + '</div>' +
      '<div class="meta">' + (r.accurate ? '<span class="chip ok">✓ Akurat</span>' : '<span class="chip no">✗ Tidak akurat</span>') +
      '<span class="dl">' + r.catsPass + '/' + r.catsActive + ' PASS · ' + delta + '</span></div>' +
    '</div>';
  }

  function matrixRow(r) {
    return '<tr data-c="' + esc(r.center) + '"><td>' + esc(r.center) + '</td>' + D.categories.map(c => {
      const d = detailFor(period, r.center, c.key);
      if (!d) return '<td class="none" title="Tidak ada record">—</td>';
      return '<td class="' + (d.pass ? 'pass' : 'fail') + '" data-tip="cell" data-c="' + esc(r.center) + '" data-k="' + c.key + '">' +
        '<span class="ic" aria-hidden="true">' + (d.pass ? '✓' : '✗') + '</span>' + pct(d.daysPassPct) +
        '<span class="sr" style="position:absolute;left:-9999px">' + (d.pass ? 'PASS' : 'FAIL') + '</span></td>';
    }).join('') + '<td class="acc" data-tip="acc" data-c="' + esc(r.center) + '">' + pct(r.accuracy, 1) + '</td></tr>';
  }

  // ── tooltips ──────────────────────────────────────────────────────────────
  const tip = () => $('#tip');
  function showTip(html, x, y) {
    const t = tip();
    t.innerHTML = html;
    t.classList.add('on');
    const w = t.offsetWidth, h = t.offsetHeight;
    let left = x + 14, top = y + 14;
    if (left + w > window.innerWidth - 8) left = x - w - 14;
    if (top + h > window.innerHeight - 8) top = y - h - 14;
    t.style.left = Math.max(8, left) + 'px';
    t.style.top = Math.max(8, top) + 'px';
  }
  function hideTip() { tip().classList.remove('on'); }
  const trow = (k, v, sw) => '<div class="r"><span>' + (sw ? '<i class="sw" style="background:' + sw + '"></i>' : '') + k + '</span><b>' + v + '</b></div>';

  function tipHtml(el) {
    const c = el.dataset.c;
    if (el.dataset.tip === 'rank') {
      const r = D.ranking.find(x => x.period === period && x.center === c);
      return '<div class="t">#' + r.rank + ' ' + esc(c) + ' · ' + pct(r.score, 1) + '</div>' +
        D.categories.map(k => {
          const d = detailFor(period, c, k.key);
          return trow(esc(k.name), d ? (d.pass ? '✓ ' : '✗ ') + pct(d.daysPassPct) : '—');
        }).join('') + trow('Month Accuracy', pct(r.accuracy, 1));
    }
    if (el.dataset.tip === 'cell') {
      const d = detailFor(period, c, el.dataset.k);
      const name = D.categories.find(k => k.key === el.dataset.k).name;
      return '<div class="t">' + esc(c) + ' · ' + esc(name) + '</div>' +
        trow('Status', d.pass ? '✓ PASS' : '✗ FAIL') +
        trow('Hari lolos', d.passDays + ' dari ' + d.activeDays) +
        trow('Record lengkap', num(d.complete) + ' dari ' + num(d.records)) +
        trow('Month Accuracy', pct(d.accuracy, 1));
    }
    if (el.dataset.tip === 'day') {
      const [y, m] = [Number(period.slice(0, 4)), Number(period.slice(4))];
      const date = new Date(y, m - 1, Number(el.dataset.d)).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
      const records = Number(el.dataset.n), complete = Number(el.dataset.ok);
      return '<div class="t">' + esc(date) + '</div>' +
        trow('Record lengkap', num(complete) + ' dari ' + num(records)) +
        trow('Daily %', pct(complete / records)) +
        trow('Status', complete / records >= D.dailyMin - 1e-9 ? '✓ lolos' : '✗ gagal');
    }
    if (el.dataset.tip === 'acc') {
      return '<div class="t">' + esc(c) + ' · Month Accuracy</div><div class="r"><span>Rata-rata % record lengkap dari kategori yang punya data</span></div>';
    }
    return '';
  }

  function bindTips(root) {
    (root || document).querySelectorAll('[data-tip]').forEach(el => {
      el.addEventListener('mousemove', e => showTip(tipHtml(el), e.clientX, e.clientY));
      el.addEventListener('mouseleave', hideTip);
      el.addEventListener('click', e => showTip(tipHtml(el), e.clientX, e.clientY));
    });
  }
  document.addEventListener('scroll', hideTip, { passive: true });

  // ── center detail ─────────────────────────────────────────────────────────
  function renderDetail() {
    const box = $('#detail');
    if (!box) return;
    const rows = rowsFor(period);
    if (!center) { box.innerHTML = '<div class="state">Tidak ada center di bulan ini.</div>'; return; }
    document.querySelectorAll('.rank-row, .mx tbody tr').forEach(el => el.classList.toggle('sel', el.dataset.c === center));
    const r = rows.find(x => x.center === center);

    let html = '<div class="card-h"><h2>Detail ' + esc(center) + ' · ' + esc(label(period)) + '</h2>' +
      '<div class="pills" role="group" aria-label="Pilih center">' + rows.map(x =>
        '<button type="button" class="pill" data-c="' + esc(x.center) + '" aria-pressed="' + (x.center === center) + '">' + esc(x.center) + '</button>').join('') +
      '</div></div>' +
      '<div class="dsum">Peringkat #' + r.rank + ' · skor ' + pct(r.score, 1) + ' · ' + r.catsPass + '/' + r.catsActive + ' kategori PASS · ' +
        (r.accurate ? '✓ Akurat' : '✗ Tidak akurat') + '</div>' +
      '<div class="calkey"><span><i class="pass"></i>hari lolos (Daily % ≥ ' + pct(D.dailyMin) + ')</span><span><i class="fail"></i>hari gagal</span>' +
        '<span><i class="none"></i>tidak ada record</span><span>arahkan kursor / ketuk tanggal untuk detail</span></div>';

    const pd = periodDetail[period];
    html += '<div class="dgrid">' + D.categories.map(c => catCard(c, pd)).join('') + '</div>';
    box.innerHTML = html;
    box.querySelectorAll('.pill').forEach(b => b.addEventListener('click', () => selectCenter(b.dataset.c, false)));
    bindTips(box);

    if (!pd) loadPeriodDetail(period);
  }

  function loadPeriodDetail(p) {
    if (periodDetail[p] === 'loading') return;
    periodDetail[p] = 'loading';
    google.script.run
      .withSuccessHandler(json => { periodDetail[p] = JSON.parse(json); if (p === period) renderDetail(); })
      .withFailureHandler(() => { periodDetail[p] = { available: false, failed: true }; if (p === period) renderDetail(); })
      .crGetPeriodDetail(p);
  }

  function catCard(c, pd) {
    const d = detailFor(period, center, c.key);
    if (!d) {
      return '<div class="dcard nodata"><div class="dhead"><h3>' + esc(c.name) + '</h3></div>Tidak ada record bulan ini.</div>';
    }
    const incomplete = d.records - d.complete;
    let html = '<div class="dcard"><div class="dhead"><h3>' + esc(c.name) + '</h3>' +
      (d.pass ? '<span class="chip ok">✓ PASS</span>' : '<span class="chip no">✗ FAIL</span>') + '</div>' +
      '<div class="stats">' +
        '<div class="stat"><div class="v">' + pct(d.daysPassPct) + '</div><div class="k">' + d.passDays + ' dari ' + d.activeDays + ' hari lolos</div></div>' +
        '<div class="stat"><div class="v">' + pct(d.accuracy, 1) + '</div><div class="k">' + num(d.complete) + ' dari ' + num(d.records) + ' record lengkap</div></div>' +
        '<div class="stat"><div class="v">' + num(incomplete) + '</div><div class="k">record tidak lengkap</div></div>' +
      '</div>';

    if (!pd || pd === 'loading') {
      return html + '<div class="skel"></div><div class="skel" style="width:70%"></div></div>';
    }
    if (!pd.available) {
      return html + '<div class="muted">' + (pd.failed ? 'Gagal memuat kalender dan field kosong.' :
        'Kalender dan field kosong muncul setelah <b>📊 Center Ranking → Refresh now</b> dijalankan dengan versi script terbaru.') + '</div></div>';
    }

    // Calendar (Monday first)
    const y = Number(period.slice(0, 4)), m = Number(period.slice(4));
    const days = new Date(y, m, 0).getDate();
    const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;
    const byDay = {};
    pd.daily.forEach(x => { if (x[0] === center && x[1] === c.key) byDay[x[2]] = x; });
    let cal = ['S', 'S', 'R', 'K', 'J', 'S', 'M'].map(w => '<div class="wd" aria-hidden="true">' + w + '</div>').join('');
    for (let i = 0; i < lead; i++) cal += '<div></div>';
    for (let day = 1; day <= days; day++) {
      const x = byDay[day];
      if (!x) { cal += '<div class="d none" title="Tidak ada record">' + day + '</div>'; continue; }
      const ok = x[4] / x[3] >= D.dailyMin - 1e-9;
      cal += '<div class="d ' + (ok ? 'pass' : 'fail') + '" data-tip="day" data-d="' + day + '" data-n="' + x[3] + '" data-ok="' + x[4] + '" ' +
        'aria-label="' + day + ': ' + (ok ? 'lolos' : 'gagal') + '">' + day + '</div>';
    }
    html += '<div class="sub-h">Kalender harian</div><div class="cal">' + cal + '</div>';

    // Top missing fields
    const mf = pd.missing.filter(x => x[0] === center && x[1] === c.key).sort((a, b) => b[4] - a[4]);
    html += '<div class="sub-h">Field kosong teratas<span>dari ' + num(incomplete) + ' record tidak lengkap</span></div>';
    if (!incomplete) {
      html += '<div class="muted">Semua record lengkap.</div>';
    } else if (!mf.length) {
      html += '<div class="muted">Kolom Missing Field(s) tidak terbaca untuk kategori ini.</div>';
    } else {
      html += '<div class="mf">' + mf.slice(0, 5).map(x =>
        '<div class="f" title="' + esc(x[2]) + ' (kolom ' + esc(x[3]) + ')">' + esc(x[2]) + '</div>' +
        '<div class="b" aria-hidden="true"><i style="width:' + Math.min(100, x[4] / incomplete * 100).toFixed(1) + '%"></i></div>' +
        '<div class="n">' + num(x[4]) + ' record</div>').join('') + '</div>' +
        (mf.length > 5 ? '<div class="muted" style="margin-top:6px">+' + (mf.length - 5) + ' field lain</div>' : '');
    }
    return html + '</div>';
  }

  load();
})();
</script>
</body>
</html>
